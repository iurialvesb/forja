# Genera Forja.xcodeproj con XcodeGen:  brew install xcodegen && cd ios && xcodegen
name: Forja
options:
  bundleIdPrefix: com.forja
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: es
configs:
  Debug: debug
  Release: release
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.20.0
settings:
  base:
    SWIFT_VERSION: "5.0"         # modo Swift 5 (concurrencia estricta desactivada) para una primera compilación limpia
    SWIFT_STRICT_CONCURRENCY: minimal
    DEVELOPMENT_TEAM: ""            # ← tu Team ID del Apple Developer Program
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Forja:
    type: application
    platform: iOS
    sources:
      - path: Forja
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.forja.app
        INFOPLIST_FILE: Forja/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Forja/Resources/Forja.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: Supabase
        product: Supabase
      - sdk: HealthKit.framework
  ForjaTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ForjaTests]
    dependencies:
      - target: Forja
