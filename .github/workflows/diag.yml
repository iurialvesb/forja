name: diag
on: push
jobs:
  d:
    if: contains(github.event.head_commit.message, '[diag]')
    runs-on: ubuntu-latest
    steps:
      - env: { T: "${{ secrets.SUPABASE_ACCESS_TOKEN }}", P: "${{ secrets.SUPABASE_PROJECT_ID }}" }
        run: |
          q() { curl -s -X POST "https://api.supabase.com/v1/projects/$P/database/query" -H "Authorization: Bearer $T" -H 'content-type: application/json' -d "$(jq -n --arg q "$1" '{query:$q}')"; echo; }
          q "select date, sleep_h, sleep_score, rhr, hrv_ms, avg_sleeping_hr, source, updated_at from daily_health where date >= current_date - 6 order by date"
          q "select external_id, received_at, processed_at, payload->>'id' as d, payload->>'sleepSecs' as sleep, payload->>'sleepScore' as score, payload->>'restingHR' as rhr, payload->>'hrv' as hrv, payload->>'updated' as upd from intervals_inbox where kind='wellness' and received_at > now() - interval '5 days' order by received_at"
