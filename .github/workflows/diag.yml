name: Diagnóstico
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Consultas
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          q() { echo "== $1"; curl -s -X POST "https://api.supabase.com/v1/projects/$REF/database/query" -H "Authorization: Bearer $TOKEN" -H 'content-type: application/json' -d "$(jq -n --arg q "$2" '{query:$q}')" | jq -c '.' | cut -c1-6000; }
          q conn "select user_id, athlete_id, last_pull_at, last_error, history_from, wellness_backfill_at from intervals_connections"
          q inbox "select kind, external_id, received_at, processed_at, left(coalesce(result::text,''),200) r, payload->>'start_date_local' s, payload->>'type' t, payload->>'name' n from intervals_inbox where received_at > now() - interval '2 days' order by received_at desc limit 25"
          q sesiones "select started_at, title, discipline, primary_source, duration_s, created_at from sessions where started_at > now() - interval '2 days' order by started_at desc"
          q cron "select jobname, schedule, active from cron.job"
          q runs "select j.jobname, d.status, left(d.return_message,200) m, d.start_time from cron.job_run_details d join cron.job j using (jobid) where j.jobname='forja-intervals' order by d.start_time desc limit 6"
          q http "select id, status_code, left(content::text,300) c, error_msg, created from net._http_response order by created desc limit 6"
          q salud "select date, sleep_h, hrv_ms, rhr, steps, updated_at from daily_health order by date desc limit 5"
