name: diag
on: push
jobs:
  d:
    if: contains(github.event.head_commit.message, '[diag]')
    runs-on: ubuntu-latest
    steps:
      - env: { T: "${{ secrets.SUPABASE_ACCESS_TOKEN }}", P: "${{ secrets.SUPABASE_PROJECT_ID }}" }
        run: |
          q() { curl -s -X POST "https://api.supabase.com/v1/projects/$P/database/query" -H "Authorization: Bearer $T" -H 'content-type: application/json' -d "$(jq -n --arg q "$1" '{query:$q}')"; echo; }
          q "select id, started_at, duration_s, moving_time_s, distance_m, avg_hr, primary_source, title from sessions where discipline='running' and deleted_at is null and started_at > now() - interval '10 days' order by started_at desc"
          q "select payload->>'start_date_local' s, payload->>'moving_time' mv, payload->>'elapsed_time' el, payload->>'distance' d, payload->>'icu_distance' icud, payload->>'type' t from intervals_inbox where kind='activity' and received_at > now() - interval '10 days' order by received_at desc limit 6"
