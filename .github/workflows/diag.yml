name: diag
on: push
jobs:
  d:
    if: contains(github.event.head_commit.message, '[diag]')
    runs-on: ubuntu-latest
    steps:
      - env: { T: "${{ secrets.SUPABASE_ACCESS_TOKEN }}", P: "${{ secrets.SUPABASE_PROJECT_ID }}" }
        run: |
          q() { curl -s -X POST "https://api.supabase.com/v1/projects/$P/database/query" -H "Authorization: Bearer $T" -H 'content-type: application/json' -d "$(jq -n --arg q "$1" '{query:$q}')"; echo; }
          q "select last_pull_at, last_error, wellness_backfill_at, history_from from intervals_connections"
          q "select external_id, received_at, processed_at, payload->>'sleepSecs' s, payload->>'hrv' h, payload->>'restingHR' r, payload->>'updated' u from intervals_inbox where kind='wellness' order by external_id desc limit 5"
          q "select jobname, schedule, active from cron.job"
          q "select j.jobname, d.status, d.start_time, left(d.return_message,120) m from cron.job_run_details d join cron.job j using (jobid) order by d.start_time desc limit 6"
          q "select date, sleep_h, hrv_ms, rhr, source, updated_at from daily_health where date >= current_date - 3 order by date"
