name: diag
on: push
jobs:
  d:
    if: contains(github.event.head_commit.message, '[diag]')
    runs-on: ubuntu-latest
    steps:
      - env: { T: "${{ secrets.SUPABASE_ACCESS_TOKEN }}", P: "${{ secrets.SUPABASE_PROJECT_ID }}" }
        run: |
          q() { curl -s -X POST "https://api.supabase.com/v1/projects/$P/database/query" -H "Authorization: Bearer $T" -H 'content-type: application/json' -d "$(jq -n --arg q "$1" '{query:$q}')"; echo; }
          q "delete from sleep_nights where date in ('2026-11-26','2026-11-27') returning date"
          q "update daily_health set sleep_h=null where date in ('2026-11-26','2026-11-27') returning date"
          q "update health_inbox set processed_at=null, result=null where received_at between '2026-11-27 07:42:26' and '2026-11-27 07:42:27' returning received_at"
