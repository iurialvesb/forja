name: Diagnóstico
on:
  push:
    paths: ['.github/workflows/diag.yml']
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Latencias de funciones
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          S=$(date -u -d '-3 days' +%Y-%m-%dT%H:%M:%SZ); E=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          lg() { echo "== $1"; curl -s -G "https://api.supabase.com/v1/projects/$REF/analytics/endpoints/logs" -H "Authorization: Bearer $TOKEN" --data-urlencode "sql=$2" --data-urlencode "iso_timestamp_start=$S" --data-urlencode "iso_timestamp_end=$E" | jq -c '.result // .' | cut -c1-9000; }
          lg sources "select source_name, count() n from logs group by source_name order by n desc"
          lg muestra "select source_name, timestamp, event_message, toString(log_attributes) a from logs where source_name ilike '%function%' and event_message ilike '%nutrition%' order by timestamp desc limit 3"
          lg muestra2 "select source_name, timestamp, event_message, toString(log_attributes) a from logs where source_name ilike '%edge%' and toString(log_attributes) ilike '%functions/v1%' order by timestamp desc limit 2"
          q() { echo "== $1"; curl -s -X POST "https://api.supabase.com/v1/projects/$REF/database/query" -H "Authorization: Bearer $TOKEN" -H 'content-type: application/json' -d "$(jq -n --arg q "$2" '{query:$q}')" | jq -c '.' | cut -c1-3000; }
