name: diag
on: push
jobs:
  d:
    if: contains(github.event.head_commit.message, '[diag]')
    runs-on: ubuntu-latest
    steps:
      - env: { K: "${{ secrets.GEMINI_API_KEY }}" }
        run: |
          curl -s -H "x-goog-api-key: $K" "https://generativelanguage.googleapis.com/v1beta/models?pageSize=200" | jq -r '.models[].name' | grep -i flash | head -30
          for m in gemini-flash-lite-latest gemini-3.5-flash-lite gemini-flash-latest gemini-3.5-flash gemini-3.1-flash-lite gemini-2.5-flash gemini-pro-latest; do
            c=$(curl -s -o /tmp/o -w '%{http_code}' -H "x-goog-api-key: $K" -H 'content-type: application/json' -d '{"contents":[{"parts":[{"text":"di hola"}]}]}' "https://generativelanguage.googleapis.com/v1beta/models/$m:generateContent"); echo "$m $c $(jq -r '.error.message // empty' /tmp/o | cut -c1-90)"; done
