name: Diagnóstico
on:
  push:
    paths: ['.github/workflows/diag.yml']
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Latencias de funciones
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          S=$(date -u -d '-3 days' +%Y-%m-%dT%H:%M:%SZ); E=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          lg() { echo "== $1"; curl -s -G "https://api.supabase.com/v1/projects/$REF/analytics/endpoints/logs" -H "Authorization: Bearer $TOKEN" --data-urlencode "sql=$2" --data-urlencode "iso_timestamp_start=$S" --data-urlencode "iso_timestamp_end=$E" | jq -c '.result // .' | cut -c1-9000; }
          lg funcs "select extract(log_attributes['request.pathname'], '/functions/v1/([a-z-]+)') fn, count() n, toInt32(avg(toInt32OrZero(log_attributes['execution_time_ms']))) avg_ms, toInt32(quantile(0.5)(toInt32OrZero(log_attributes['execution_time_ms']))) p50, toInt32(quantile(0.9)(toInt32OrZero(log_attributes['execution_time_ms']))) p90, max(toInt32OrZero(log_attributes['execution_time_ms'])) max_ms from logs where source = 'function_edge_logs' group by fn order by n desc limit 30"
          lg nutday "select timestamp, log_attributes['execution_time_ms'] ms, log_attributes['response.status_code'] st, log_attributes['request.method'] m from logs where source = 'function_edge_logs' and log_attributes['request.pathname'] like '%nutrition-day%' order by timestamp desc limit 20"
          lg nutlog "select timestamp, log_attributes['execution_time_ms'] ms, log_attributes['response.status_code'] st from logs where source = 'function_edge_logs' and log_attributes['request.pathname'] like '%nutrition-log%' order by timestamp desc limit 20"
          lg boots "select count() n from logs where source = 'function_logs' and event_message ilike '%booted%'"
          lg rest "select extract(log_attributes['request.path'], '/rest/v1/([a-z_]+)') tbl, count() n from logs where source = 'edge_logs' and log_attributes['request.path'] like '/rest/v1/%' group by tbl order by n desc limit 20"
          q() { echo "== $1"; curl -s -X POST "https://api.supabase.com/v1/projects/$REF/database/query" -H "Authorization: Bearer $TOKEN" -H 'content-type: application/json' -d "$(jq -n --arg q "$2" '{query:$q}')" | jq -c '.' | cut -c1-3000; }
