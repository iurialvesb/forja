name: diag
on: push
jobs:
  d:
    if: contains(github.event.head_commit.message, '[diag]')
    runs-on: ubuntu-latest
    steps:
      - env: { T: "${{ secrets.SUPABASE_ACCESS_TOKEN }}", P: "${{ secrets.SUPABASE_PROJECT_ID }}" }
        run: |
          q() { curl -s -X POST "https://api.supabase.com/v1/projects/$P/database/query" -H "Authorization: Bearer $T" -H 'content-type: application/json' -d "$(jq -n --arg q "$1" '{query:$q}')"; echo; }
          q "select received_at, processed_at, left(payload::text, 1200) p, result from health_inbox where received_at > now() - interval '20 hours' order by received_at desc limit 4"
          q "select date, deep_min, core_min, rem_min, awake_min, updated_at from sleep_nights order by date desc limit 3"
          q "select date, sleep_h, hrv_ms, rhr, source, updated_at from daily_health where date >= current_date - 2 order by date"
          q "select external_id, received_at, payload->>'sleepSecs' s from intervals_inbox where kind='wellness' order by external_id desc limit 3"
          q "select last_pull_at, last_error from intervals_connections"
