name: diag
on: push
jobs:
  d:
    if: contains(github.event.head_commit.message, '[diag]')
    runs-on: ubuntu-latest
    steps:
      - env: { T: "${{ secrets.SUPABASE_ACCESS_TOKEN }}", P: "${{ secrets.SUPABASE_PROJECT_ID }}" }
        run: |
          q() { curl -s -X POST "https://api.supabase.com/v1/projects/$P/database/query" -H "Authorization: Bearer $T" -H 'content-type: application/json' -d "$(jq -n --arg q "$1" '{query:$q}')"; echo; }
          q "select last_pull_at from intervals_connections"
          q "select external_id, received_at, payload->>'sleepSecs' s, payload->>'updated' u from intervals_inbox where kind='wellness' order by external_id desc limit 4"
          q "select date, sleep_h, source, updated_at from daily_health where date >= current_date - 3 order by date"
          q "select last_used_at from health_tokens"
